[package]
name = "ddpub"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
comrak = "0.36"
hex = "0.4"
regex = "1"
rss = "2"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }
minijinja = "2"
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"
